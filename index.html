    <style>
      html {
        background: #f2f2f7;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 20% 0%, #ffffff 0%, #f2f2f7 55%, #ececf1 100%);
        z-index: 9999;
      }
      #boot .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #boot img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(20, 20, 30, 0.14);
        animation: boot-logo-in 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #boot .boot-name {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
        animation: boot-name-in 600ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #boot .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        background: rgba(60, 60, 67, 0.12);
        overflow: hidden;
        animation: boot-bar-in 500ms 200ms ease both;
      }
      @keyframes boot-logo-in {
        from {
          opacity: 0;
          transform: scale(0.72) translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-name-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-bar-in {
        from {
          opacity: 0;
          transform: scaleX(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img,
        #boot .boot-name,
        #boot .boot-bar {
          animation: none;
        }
      }
      #boot .boot-bar::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #0b8a67;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>

        <div class="boot-bar"></div>
