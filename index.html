<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>SeatShop — Ventes Seatiks</title>
    <meta
      name="description"
      content="Votre administration de vente de billets, façon Shopify. Ventes, inventaire et alertes en temps réel."
    />
    <meta name="theme-color" content="#0b2b23" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SeatShop" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SeatShop — Ventes Seatiks" />
    <meta
      property="og:description"
      content="Vos ventes de billets, en temps réel. Une PWA installable sur iPhone et Android."
    />
    <meta property="og:image" content="./icons/icon-512.png" />

    <style>
      html {
        background: #0b2b23;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 20% 0%, #164b3b 0%, #0b2b23 55%, #071c17 100%);
        z-index: 9999;
      }
      #boot .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #boot img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      #boot .boot-name {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #boot .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #boot .boot-bar::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #5fd6b3;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <img src="./icons/icon-180.png" alt="" />
        <div class="boot-name">SeatShop</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <noscript>SeatShop a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
